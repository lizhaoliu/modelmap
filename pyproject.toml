[project]
name = "modelmap"
version = "0.2.0"
description = "Interactive, animated architecture maps for any Hugging Face model — no weights downloaded"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.6",
    "transformers>=4.55",
    "huggingface_hub>=0.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
modelmap = "modelmap.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmap"]
# the built SPA is git-ignored (produced by `cd web && npm run build`) but must
# ship in the wheel — `artifacts` includes VCS-ignored paths
artifacts = ["src/modelmap/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/modelmap", "README.md", "pyproject.toml"]
artifacts = ["src/modelmap/web/**"]

# Extraction runs on the meta device and never touches weights, so the
# CPU-only torch build is all we need (design doc §09).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
