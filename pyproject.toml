[project]
name = "modelmap"
version = "0.1.0"
description = "Interactive, animated architecture maps for any Hugging Face model — no weights downloaded"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.6",
    "transformers>=4.55",
    "huggingface_hub>=0.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
modelmap = "modelmap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmap"]

# Extraction runs on the meta device and never touches weights, so the
# CPU-only torch build is all we need (design doc §09).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
